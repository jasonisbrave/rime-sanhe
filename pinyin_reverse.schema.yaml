# Rime schema
# encoding: utf-8
# 三合输入法 · 拼音反查依赖方案
# 本方案仅供五笔86方案的 z 键拼音反查在部署时编译词库，不可直接选用。
schema:
  schema_id: pinyin_reverse
  name: 拼音反查依赖
  version: "1.0"
  description: 五笔86方案的反查词库依赖，请勿在选单中启用。

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " "

translator:
  dictionary: pinyin_reverse
  enable_user_dict: false
  enable_completion: false
